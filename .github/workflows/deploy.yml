name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages URL
        run: |
          echo "PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          echo "PUBLIC_SITE_LANG=en" >> "$GITHUB_ENV"
          if [ "$GITHUB_REPOSITORY" = "${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "PUBLIC_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch latest Mars rover photos
        run: pnpm exec tsx scripts/generate-mars-photos.ts
        env:
          MARS_VISTA_API_KEY: ${{ secrets.MARS_VISTA_API_KEY }}
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist  # Astro默认构建输出目录
          include-hidden-files: true  # Keep .nojekyll (excluded by default since v4)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5